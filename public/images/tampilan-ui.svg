      <stop offset=".68" stop-color="#102c2b" stop-opacity=".43"/>
      <stop offset="1" stop-color="#102c2b" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="sea" x2="0" y2="1">
      <stop stop-color="#74b8b2"/>
      <stop offset="1" stop-color="#226c70"/>
    </linearGradient>
    <linearGradient id="mountain" x2="0" y2="1">
      <stop stop-color="#466f63"/>
      <stop offset="1" stop-color="#244b48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
