<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1240" viewBox="0 0 1760 1240" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Pratinjau tampilan web Innes Arsen Wisata</title>
  <desc id="description">Mockup antarmuka desktop beranda dan tampilan mobile halaman rekomendasi paket wisata Innes Arsen Wisata.</desc>
  <defs>
    <linearGradient id="canvas" x2="0" y2="1">
      <stop stop-color="#f0f6f4"/>
      <stop offset="1" stop-color="#e8eef3"/>
    </linearGradient>
    <linearGradient id="hero" x2="1" y2="1">
      <stop stop-color="#27594f"/>
      <stop offset=".55" stop-color="#4c8576"/>
      <stop offset="1" stop-color="#bfd8cb"/>
    </linearGradient>
    <linearGradient id="shade" x2="1">
