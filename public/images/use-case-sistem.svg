<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1740" viewBox="0 0 1400 1740" role="img" aria-labelledby="title description" style="max-width:100%;height:auto">
  <title id="title">Use case diagram sistem informasi PT. Innes Arsen Wisata</title>
  <desc id="description">Diagram use case dengan aktor Pengunjung, Konsumen, dan Admin serta fitur publik, pemesanan, pembayaran, MoU, dan pengelolaan aplikasi.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#172b4d}.title{font-size:32px;font-weight:700}.subtitle{font-size:16px;fill:#64748b}.boundary{fill:#fff;stroke:#8da2b8;stroke-width:2}.boundary-title{font-size:19px;font-weight:700;fill:#0f766e}.group{fill:#f4f8fc;stroke:#dbe4ee;stroke-width:1.2}.group-title{font-size:14px;font-weight:700;letter-spacing:1px;fill:#64748b}.usecase{fill:#fff;stroke:#5483b7;stroke-width:2}.usecase-customer{fill:#ecfdf5;stroke:#56a58e;stroke-width:2}.usecase-admin{fill:#eef2ff;stroke:#7187c5;stroke-width:2}.uc-label{font-size:15px;font-weight:700}.uc-small{font-size:13px;fill:#52657a}.actor{stroke:#334155;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.actor-label{font-size:15px;font-weight:700}.assoc{fill:none;stroke:#8291a3;stroke-width:1.7}.note{font-size:13px;fill:#52657a}.note-box{fill:#fff7e8;stroke:#e6b45c;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1400" height="1740" fill="#f7f9fc"/>
  <text class="title" x="700" y="52" text-anchor="middle">USE CASE DIAGRAM</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">Sistem Informasi PT. Innes Arsen Wisata · Berdasarkan fitur dan hak akses aplikasi</text>

  <rect class="boundary" x="270" y="115" width="900" height="1560" rx="22"/>
  <text class="boundary-title" x="720" y="151" text-anchor="middle">SISTEM INFORMASI TOUR &amp; TRAVEL</text>
  <rect class="group" x="290" y="175" width="860" height="300" rx="16"/>
  <text class="group-title" x="315" y="202">LAYANAN PUBLIK</text>
  <rect class="group" x="290" y="490" width="860" height="470" rx="16"/>
  <text class="group-title" x="315" y="517">LAYANAN KONSUMEN (WAJIB LOGIN)</text>
  <rect class="group" x="290" y="975" width="860" height="630" rx="16"/>
  <text class="group-title" x="315" y="1002">PANEL ADMIN</text>

