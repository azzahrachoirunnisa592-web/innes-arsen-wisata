  <path class="assoc" d="M1240 1300H1210V1400H910"/>
  <path class="assoc" d="M1240 1300H1210V1470H910"/>
  <path class="assoc" d="M1240 1300H1210V1540H910"/>

  <ellipse class="usecase" cx="700" cy="270" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="275" text-anchor="middle">Lihat beranda &amp; profil perusahaan</text>
  <ellipse class="usecase" cx="700" cy="335" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="340" text-anchor="middle">Jelajahi destinasi &amp; paket wisata</text>
  <ellipse class="usecase" cx="700" cy="400" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="405" text-anchor="middle">Baca artikel, berita &amp; editorial</text>
  <ellipse class="usecase" cx="700" cy="465" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="470" text-anchor="middle">Daftar akun / masuk</text>

  <ellipse class="usecase-customer" cx="700" cy="555" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="560" text-anchor="middle">Ajukan pemesanan paket wisata</text>
  <ellipse class="usecase-customer" cx="700" cy="620" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="625" text-anchor="middle">Lihat dashboard &amp; status pesanan</text>
  <ellipse class="usecase-customer" cx="700" cy="685" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="690" text-anchor="middle">Lihat invoice &amp; kirim bukti pembayaran</text>
  <ellipse class="usecase-customer" cx="700" cy="750" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="755" text-anchor="middle">Cetak kuitansi pembayaran lunas</text>
  <ellipse class="usecase-customer" cx="700" cy="815" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="820" text-anchor="middle">Ajukan kerja sama MoU</text>
  <ellipse class="usecase-customer" cx="700" cy="880" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="885" text-anchor="middle">Lihat status &amp; unduh dokumen MoU</text>
  <ellipse class="usecase-customer" cx="700" cy="945" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="950" text-anchor="middle">Keluar dari akun</text>

  <ellipse class="usecase-admin" cx="700" cy="1050" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1055" text-anchor="middle">Kelola destinasi &amp; paket wisata</text>
  <ellipse class="usecase-admin" cx="700" cy="1120" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1125" text-anchor="middle">Kelola profil, galeri &amp; anggota manajemen</text>
  <ellipse class="usecase-admin" cx="700" cy="1190" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1195" text-anchor="middle">Kelola metode pembayaran</text>
  <ellipse class="usecase-admin" cx="700" cy="1260" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1265" text-anchor="middle">Kelola pesanan &amp; keputusan negosiasi</text>
  <ellipse class="usecase-admin" cx="700" cy="1330" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1335" text-anchor="middle">Tinjau dan putuskan pembayaran</text>
  <ellipse class="usecase-admin" cx="700" cy="1400" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1405" text-anchor="middle">Tinjau pengajuan MoU &amp; dokumen</text>
  <ellipse class="usecase-admin" cx="700" cy="1470" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1475" text-anchor="middle">Lihat dashboard &amp; daftar konsumen</text>
  <ellipse class="usecase-admin" cx="700" cy="1540" rx="210" ry="27"/>
  <text class="uc-label" x="700" y="1545" text-anchor="middle">Lihat bukti dan detail transaksi</text>

  <rect class="note-box" x="310" y="1615" width="820" height="42" rx="10"/>
  <text class="note" x="720" y="1641" text-anchor="middle">Admin memeriksa bukti transfer secara manual; tidak ada integrasi pembayaran otomatis.</text>

  <g transform="translate(200 315)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20V82M-36 45H36M0 82L-30 122M0 82L30 122"/>
    <text class="actor-label" x="0" y="150" text-anchor="middle">Pengunjung</text>
  </g>
  <g transform="translate(200 750)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20V82M-36 45H36M0 82L-30 122M0 82L30 122"/>
    <text class="actor-label" x="0" y="150" text-anchor="middle">Konsumen</text>
  </g>
  <g transform="translate(1280 1275)">
    <circle class="actor" cx="0" cy="0" r="20"/>
    <path class="actor" d="M0 20V82M-36 45H36M0 82L-30 122M0 82L30 122"/>
    <text class="actor-label" x="0" y="150" text-anchor="middle">Admin</text>
  </g>
