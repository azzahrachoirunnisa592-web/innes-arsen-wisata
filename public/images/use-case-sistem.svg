  <path class="assoc" d="M240 785H260V880H490"/>
  <path class="assoc" d="M240 785H260V945H490"/>
  <path class="assoc" d="M1240 1300H1210V1050H910"/>
  <path class="assoc" d="M1240 1300H1210V1120H910"/>
  <path class="assoc" d="M1240 1300H1210V1190H910"/>
  <path class="assoc" d="M1240 1300H1210V1260H910"/>
